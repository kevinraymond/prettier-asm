.c .bg{stroke:var(--edge);stroke-width:1}
.c .grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.1s cubic-bezier(.25,.8,.25,1) both}
.c .val,.c .foot{animation:fade .35s ease-out both}
