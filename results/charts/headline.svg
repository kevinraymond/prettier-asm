<svg xmlns="http://www.w3.org/2000/svg" class="c" width="820" height="402" viewBox="0 0 820 402" role="img" aria-labelledby="headline-t headline-d">
<title id="headline-t">Prettier 3.6.2, ported to hand-written x86-64 assembly</title>
<desc id="headline-d">Format 59 real files, one process per file: Prettier (Node) 4.36 s, Rust port 0.215 s, asm 0.081 s. Peak memory, one file (Fuse/src/search/index.js): Prettier (Node) 65.7 MiB, Rust port 6.44 MiB, asm 0.37 MiB. 59/59 files byte-identical to Prettier 3.6.2.</desc>
<style>
.c{--surface:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#6d6c67;--track:#f0efec;--base:#a3a29c;--feat:#2a78d6;--edge:#e1e0d9}
