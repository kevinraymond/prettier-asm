<svg xmlns="http://www.w3.org/2000/svg" class="c" width="760" height="246" viewBox="0 0 760 246" role="img" aria-labelledby="spread-t spread-d">
<title id="spread-t">Run-to-run spread per contender</title>
<desc id="spread-d">Per contender, relative standard deviation of the rep totals: Prettier 3.6.2 (Node) 0.6%, Rust port 1.5%, asm 2.3%, floor 1.3%.</desc>
<style>
.c{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--prettier:#1baf7a;--rust:#eb6834;--asm:#2a78d6;--floor:#c3c2b7;--good:#0ca30c;--warning:#fab219;--neutral:#898781;--critical:#d03b3b}
@media (prefers-color-scheme:dark){.c{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--prettier:#199e70;--rust:#d95926;--asm:#3987e5;--floor:#52514e;--good:#0ca30c;--warning:#fab219;--neutral:#6d6c67;--critical:#d03b3b}}
.c text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink);font-size:12px}
.c .t2{fill:var(--ink2)}.c .mu{fill:var(--muted)}.c .h{font-size:15px;font-weight:600}
.c .num{font-variant-numeric:tabular-nums}
.c .bg{fill:var(--surface)}.c .grid{stroke:var(--grid);stroke-width:1}.c .axis{stroke:var(--axis);stroke-width:1}
.c .s-prettier{fill:var(--prettier)}.c .s-rust{fill:var(--rust)}.c .s-asm{fill:var(--asm)}.c .s-floor{fill:var(--floor)}.c .dot{stroke:var(--surface);stroke-width:2}</style>
<rect class="bg" width="760" height="246" rx="8"/>
